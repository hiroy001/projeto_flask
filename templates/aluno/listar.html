<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Alunos</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='style/index.css') }}"
        />
    </head>
    <body>
        <div class="card">
            <h1>Alunos</h1>

            <table class="table">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Cidade</th>
                    </tr>
                </thead>

                <tbody>
                    {% for aluno in alunos %}
                    <tr>
                        <td>{{ aluno.id }}</td>
                        <td>{{ aluno.nome }}</td>
                        <td>{{ aluno.telefone }}</td>
                        <td>{{ aluno.cidade }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4">Nenhum aluno cadastrado.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <p>Total: {{ alunos|length }} aluno(s)</p>

            <a href="/" class="link">Voltar ao início</a>
        </div>
    </body>
</html>
