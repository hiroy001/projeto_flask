<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Tabuada</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='style/index.css') }}"
        />
    </head>
    <body>
        <div class="center">
            <div class="card">
                <h1>Tabuada do {{ n }}</h1>
                <div class="container">
                    {% for i in range(1, 11) %}
                    <li>{{ n }} x {{ i }} = {{ n * i }}</li>
                    {% endfor %}
                </div>
                <div class="middle-container">
                    {% if n > 1 %}
                    <a href="/tabuada/{{ n - 1 }}" class="link">‹ Anterior</a>
                    {% endif %} {% if n < 10 %}
                    <a href="/tabuada/{{ n + 1 }}" class="link">Próxima ›</a>
                    {% endif %}
                </div>
                <a href="/tabuadas" class="link">Ver todas as tabuadas</a>
                <a href="/" class="link">Voltar ao início</a>
            </div>
        </div>
    </body>
</html>
