<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Tabuada</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='style/index.css') }}"
        />
    </head>
    <body>
        <div class="center">
            <div class="card">
                <h2>Tabuada do {{ n }}</h2>
                <ul class="container">
                    {% for i in range(1, 11) %}
                    <li>{{ n }} x {{ i }} = {{ n * i }}</li>
                    {% endfor %}
                </ul>
                <p>
                    {% if n > 1 %}
                    <a href="/tabuada/{{ n - 1 }}">‹ Anterior</a>
                    {% endif %} {% if n < 10 %}
                    <a href="/tabuada/{{ n + 1 }}">Próxima ›</a>
                    {% endif %}
                </p>
                <a href="/tabuadas">Ver todas as tabuadas</a>
                <a href="/">Voltar ao início</a>
            </div>
        </div>
    </body>
</html>
