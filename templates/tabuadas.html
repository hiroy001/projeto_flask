<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Tabuadas</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='style/index.css') }}"
        />
    </head>
    <body>
        <div class="center">
            <div class="card">
                <h1>Escolha uma tabuada</h1>
                <div class="container">
                    {% for i in range(1, 11) %}
                    <a href="/tabuada/{{ i }}" class="link"
                        >Tabuada do {{ i }}</a
                    >
                    {% endfor %}
                </div>
                <br />
                <a href="/" class="link">Voltar ao início</a>
            </div>
        </div>
    </body>
</html>
